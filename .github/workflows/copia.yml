# La copia giornaliera di tcgcsv, pubblicata su GitHub Pages.
# Nel repository dei dati va in .github/workflows/copia.yml.
#
# tcgcsv si aggiorna verso le 20:00 UTC: la copia parte alle 21:30 e riprova
# alle 03:30, nel caso la sera tcgcsv fosse in ritardo. Se la data di tcgcsv
# non è cambiata, il giro finisce subito senza scaricare nulla.
name: Copia di tcgcsv

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      forza:
        description: "Copia anche se tcgcsv non è cambiato"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: copia
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copia
        id: copia
        run: |
          python3 -I copia.py --uscita sito \
            --precedente "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            ${{ inputs.forza && '--forza' || '' }}

      - if: steps.copia.outputs.cambiato == 'true'
        uses: actions/configure-pages@v5

      - if: steps.copia.outputs.cambiato == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - if: steps.copia.outputs.cambiato == 'true'
        id: pubblica
        uses: actions/deploy-pages@v4

      # GitHub sospende i lavori pianificati di un repository fermo da 60
      # giorni: se l'ultimo commit ha più di 40 giorni, ne fa uno con lo stato.
      - name: Tieni vivo il repository
        if: steps.copia.outputs.cambiato == 'true'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40 * 86400 )) ]; then
            cp sito/stato.json stato.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stato.json
            git commit -m "Stato della copia"
            git push
          fi
